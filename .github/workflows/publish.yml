name: Publish

# Publication sur npm à chaque tag vX.Y.Z (créé par `npm version`).
# Trusted publishing (OIDC) : aucun token npm à stocker, provenance ajoutée automatiquement.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm install -g npm@latest
      - name: Vérifier que le tag correspond à package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm publish
